[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4.34"
tauri = { version = "2.11.3", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rig = "0.42.0"
rig-core = "0.42.0"
futures = "0.3.34"
dotenvy = "0.15"
uuid = { version = "1.25.0", features = ["v4"] }
rdev = { git = "https://github.com/rustdesk/rdev" }
mouse_position = "0.1.4"
selection = "1.2.0"
rust-i18n = "4.2.1"

